# SPDX-License-Identifier: GPL-3.0-or-later
# Builds USBeam on every push:
#   - Windows installer (x64 + ARM64 in one setup program)
#   - Linux AppImage (most distributions with systemd)
#   - Linux package for Arch-based systems
# and tests it: stricter builds, a network-drop test, and upgrade / second-launch / uninstall
# tests on Linux and Windows (from the previous release to this build).
# Pushing a tag like v0.3.0 also publishes a GitHub Release with the files, only if every test passed.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LLVM_MINGW: llvm-mingw-20250430-ucrt-ubuntu-22.04-x86_64

jobs:
  windows-binaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross-compiler (llvm-mingw)
        run: |
          curl -sSL -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20250430/"${LLVM_MINGW}".tar.xz
          tar xf llvm-mingw.tar.xz
          echo "$PWD/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - name: Get the WebView2 SDK
        run: make webview2
      - name: Build
        run: make windows-arm64 windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/usbeam-service-*.exe
            build/usbeam-app-*.exe
            build/webview2/

  windows-installer:
    needs: windows-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Get usbip-win2 (bundled driver, checked against its published checksums)
        shell: pwsh
        run: |
          $v = "0.9.8.1"
          $files = @{
            "USBip-$v-x64.exe"   = "38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a"
            "USBip-$v-arm64.exe" = "cab7ff97f79275eeb5c5b8bb2eb3111ff6b6c4eead07d9bec9be5bd1e3a35800"
          }
          New-Item -ItemType Directory -Force build\usbip | Out-Null
          foreach ($f in $files.Keys) {
            Invoke-WebRequest -Uri "https://github.com/vadimgrn/usbip-win2/releases/download/v.$v/$f" -OutFile "build\usbip\$f"
            $h = (Get-FileHash "build\usbip\$f" -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $files[$f]) { throw "Checksum mismatch for $f ($h)" }
          }
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\usbeam.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: USBeam-Windows-Setup
          path: build/USBeam-Setup-*.exe

  linux-arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git python qt6-base qt6-webengine
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/linux' && makepkg --noconfirm -f"
      - uses: actions/upload-artifact@v4
        with:
          name: USBeam-Linux-Arch-package
          path: packaging/linux/*.pkg.tar.zst

  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: bash packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: USBeam-Linux-AppImage
          path: build/USBeam-*.AppImage

  # ---------------------------------------------------------------- tests (a release waits for all of them)
  # Stricter builds (any new compiler warning fails), script checks and the network-drop test.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross-compiler (llvm-mingw)
        run: |
          curl -sSL -o llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20250430/"${LLVM_MINGW}".tar.xz
          tar xf llvm-mingw.tar.xz
          echo "$PWD/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - name: Linux engine, warnings are errors
        run: make linux CFLAGS="-O2 -Wall -Werror -Wno-format-truncation -Wno-stringop-truncation"
      - name: Windows service (x64 + ARM64), warnings are errors
        run: |
          for a in x86_64 aarch64; do
            "$a-w64-mingw32-gcc" -O2 -Wall -Werror -Ibuild -Wno-missing-field-initializers src/windows/usbeam_host.c \
              -mwindows -o "build/svc-$a.exe" -lsetupapi -lwinusb -lws2_32 -lcfgmgr32 -liphlpapi -lshell32 -ladvapi32 -luser32
          done
      - name: Shell scripts
        run: shellcheck -S warning packaging/appimage/setup.sh packaging/appimage/build.sh tests/*.sh
      - name: Network-drop test (a dead network frees a device within ~20 s)
        run: sudo bash tests/netdrop.sh

  # Install the previous release, update to this build (also from inside the app), start the app
  # several times, uninstall: one app and one runtime at every step, nothing left behind.
  linux-upgrade-test:
    needs: linux-appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: USBeam-Linux-AppImage
          path: new
      - name: Get the previous release
        run: |
          prev=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 5 --json tagName -q '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n 1)
          echo "Previous release: $prev"
          gh release download "$prev" -R "$GITHUB_REPOSITORY" --pattern '*.AppImage' --dir old
      - name: What AppImages need
        run: sudo apt-get update -q && sudo apt-get install -y -q fuse3 xvfb libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3
      - name: Upgrade test
        run: bash tests/linux-upgrade.sh old/*.AppImage new/*.AppImage

  # The same on Windows: previous release, update the way the app does, start again, uninstall.
  windows-upgrade-test:
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: USBeam-Windows-Setup
          path: new
      - name: Get the previous release
        shell: pwsh
        run: |
          $prev = gh release list -R $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 5 --json tagName -q '.[].tagName' |
                  Where-Object { $_ -ne $env:GITHUB_REF_NAME } | Select-Object -First 1
          Write-Host "Previous release: $prev"
          gh release download $prev -R $env:GITHUB_REPOSITORY --pattern 'USBeam-Setup-*.exe' --dir old
      - name: Get usbip-win2 (checked against its published checksum)
        shell: pwsh
        run: |
          $v = "0.9.8.1"
          Invoke-WebRequest -Uri "https://github.com/vadimgrn/usbip-win2/releases/download/v.$v/USBip-$v-x64.exe" -OutFile usbip-x64.exe
          $h = (Get-FileHash usbip-x64.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "38cad6d4432b52d5bb9409d9ad03b72fdffc4ada4cd3a48fbeca1a2752a8518a") { throw "Checksum mismatch for usbip-win2 ($h)" }
      - name: Upgrade test
        shell: pwsh
        run: |
          $ver = (Select-String -Path src\common\version.h -Pattern 'USBEAM_VERSION "(.*)"').Matches[0].Groups[1].Value
          $old = (Get-ChildItem old\USBeam-Setup-*.exe)[0].FullName
          $new = (Get-ChildItem new\USBeam-Setup-*.exe)[0].FullName
          & .\tests\windows-upgrade.ps1 -Old $old -New $new -NewVersion $ver -Usbip (Resolve-Path usbip-x64.exe).Path
          exit $LASTEXITCODE
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: ${{ runner.temp }}/usbeam-test-logs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-installer, linux-appimage, linux-arch-package, checks, linux-upgrade-test, windows-upgrade-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/USBeam-Setup-*.exe
            dist/USBeam-*.AppImage
            dist/*.pkg.tar.zst
